app = "project-seed-sidecar"
primary_region = "sjc"

[build]
  dockerfile = "services/pdf-sidecar/Dockerfile"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[env]
  PORT = "3001"
  NODE_ENV = "production"
